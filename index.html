<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoShop – Recycle Smart, Earn Smart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--u:min(1vw,1.8vh);--g:#3fbf3f;--bg:#06130a;--ink:#fff;--mut:#c4d6c6;--card:rgba(8,28,14,.62);--line:rgba(255,255,255,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}
header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:22px 5vw}
.logo{font-weight:800;font-size:17px;line-height:1.05;letter-spacing:.5px;display:flex;gap:4px;align-items:flex-start}
.logo b{color:var(--g)}.logo small{display:block;font-size:7px;font-weight:600;letter-spacing:1.2px}
nav{text-shadow:0 1px 5px rgba(0,0,0,.6);display:flex;gap:clamp(14px,2vw,30px);font-size:11px;font-weight:500;align-items:center}
nav a{padding-bottom:3px;border-bottom:2px solid transparent}
nav a.on{border-color:#fff;font-weight:600}
nav .cta{background:var(--g);color:#052b0a;padding:7px 14px;border-radius:20px;font-weight:600;border:0}
#burger{display:none;background:none;border:0;color:#fff;font-size:26px}
.forest{background:var(--forest) 25% center/cover,var(--bg)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,20,6,.4),rgba(0,20,6,.12) 35%,rgba(0,20,6,.2))}
.hero{position:relative;height:100svh;min-height:520px;overflow:hidden}
.panel{position:absolute;left:0;top:0;bottom:0;width:calc(46*var(--u));background:rgba(10,30,14,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.leaves{position:absolute;left:calc(46*var(--u) - 6vw);top:0;width:12vw;min-width:70px;z-index:3}
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6vh 0 0 calc(6*var(--u));font-weight:800;font-size:calc(14.7*var(--u));line-height:.98;letter-spacing:-.02em;color:transparent;background:linear-gradient(#fff,#fff) right/calc(100% - 46*var(--u)) 100% no-repeat,var(--forest) 25% center/cover;-webkit-background-clip:text;background-clip:text}
.kick{position:absolute;left:calc(6*var(--u) + 4px);top:calc(53% - 14.5*var(--u) - 26px);font-weight:800;font-size:clamp(15px,1.7vw,22px);letter-spacing:.3px;z-index:4}
.desc{position:absolute;left:calc(6*var(--u) + 4px);top:calc(53% + 15*var(--u));width:calc(38*var(--u));min-width:230px;font-size:clamp(14px,1.45vw,19px);line-height:1.5;font-style:italic;color:#fff;z-index:4;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.desc a{display:inline-block;margin-top:14px;font-size:clamp(12px,1.1vw,15px);font-weight:800;font-style:normal;letter-spacing:.5px;border-bottom:1px solid #fff}
.dots{position:absolute;right:5vw;top:30%;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:4}
.dots i{display:block;width:1px;height:42px;background:#fff}.dots span{width:8px;height:8px;background:#fff;transform:rotate(45deg);opacity:.5;cursor:pointer}.dots span.on{opacity:1}
.arrows{position:absolute;right:5vw;bottom:calc(7vh + env(safe-area-inset-bottom,0px));display:flex;gap:14px;z-index:4}
.arrows button{width:38px;height:36px;border:0;color:#fff;font-size:18px;background:rgba(255,255,255,.25);cursor:pointer}.arrows button+button{background:rgba(0,0,0,.55)}
.page{position:relative;min-height:100vh;padding:110px 6vw 60px;background:linear-gradient(rgba(4,18,8,.4),rgba(4,18,8,.55)),var(--forest) 25% center/cover fixed}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:clamp(28px,6vw,46px);font-weight:800;margin-bottom:6px}h1 em{font-style:normal;color:var(--g)}
.sub{color:var(--mut);font-size:14px;margin-bottom:26px;max-width:640px}
h3{font-size:16px;margin-bottom:8px}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;font-size:13.5px;color:#e4eee5;line-height:1.65}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.grid .card{margin:0}
.bar{margin:10px 0}.bar div{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar p{height:8px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}.bar p i{display:block;height:100%;background:linear-gradient(90deg,#1f8f2f,#7bff6a);border-radius:6px}
.big{font-size:34px;font-weight:800;color:var(--g)}
.btn{background:var(--g);color:#052b0a;border:0;border-radius:24px;padding:11px 22px;font:600 13px Poppins,sans-serif;cursor:pointer}
.btn.ghost{background:none;color:#fff;border:1px solid var(--line)}
input,select{width:100%;padding:12px 14px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;font:14px Poppins,sans-serif}
select option{color:#000}label{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}
.msg{font-size:12px;min-height:18px;margin-bottom:8px;color:#ffb4a8}.msg.ok{color:#9dff9d}
.auth{max-width:420px;margin:0 auto}
.pts{text-align:center;padding:28px 20px}.pts .n{font-size:clamp(54px,16vw,92px);font-weight:800;color:var(--g);line-height:1}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}.pos{color:#8dff8d}.neg{color:#ffa595}
.scroll{overflow-x:auto}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}
@media(max-width:760px){
 #burger{display:block}
 nav{display:none;position:absolute;top:56px;right:5vw;flex-direction:column;align-items:flex-start;gap:14px;background:rgba(5,20,9,.95);padding:18px 22px;border-radius:12px;border:1px solid var(--line)}
 nav.open{display:flex}
 .page{padding-top:90px}.dots{display:none}
}
#cb{position:fixed;left:4vw;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;width:56px;height:56px;border-radius:50%;border:0;background:var(--g);color:#052b0a;font-size:26px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.45)}
#cw{position:fixed;left:4vw;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;width:min(370px,92vw);height:min(500px,66vh);display:none;flex-direction:column;background:rgba(6,22,10,.96);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.55)}
#cw.open{display:flex}
#ch{padding:12px 16px;background:#0e3a18;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}#ch button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
#cm{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.b{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}.b.bot{background:rgba(255,255,255,.12);align-self:flex-start}.b.me{background:var(--g);color:#052b0a;align-self:flex-end}
#cq{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}#cq button{font:11.5px Poppins,sans-serif;background:none;border:1px solid var(--line);color:#fff;border-radius:14px;padding:5px 10px;cursor:pointer}
#cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}#cf input{margin:0;flex:1;font-size:16px}#cf button{padding:0 16px}

.rules{list-style:none;padding:0;margin:0 0 12px;font-size:12px;color:var(--mut)}.rules li{padding:2px 0}.rules li.ok{color:#9dff9d}
.msg{white-space:pre-line}
.vbox{background:rgba(63,191,63,.12);border:1px dashed var(--g);border-radius:10px;padding:12px;font-size:12.5px;margin:8px 0 12px;line-height:1.6}.vbox b{font-size:22px;letter-spacing:6px;color:var(--g);display:block;text-align:center;margin-top:6px}
.pf .phone{max-width:480px;margin:0 auto}
.ptop{display:flex;align-items:center;gap:18px;margin:6px 0 24px}
.av{position:relative;width:92px;height:92px;flex:none;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:linear-gradient(135deg,#1f8f2f,#0b3a14);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av .cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--g);color:#052b0a;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.pn h2{font-size:clamp(20px,5.5vw,26px);font-weight:800;line-height:1.15;word-break:break-word}
.pid{font-size:12.5px;color:var(--mut);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pid button{background:none;border:1px solid var(--mut);color:var(--mut);border-radius:12px;font:11px Poppins,sans-serif;padding:1px 9px;cursor:pointer}
.pn small{display:block;color:var(--mut);font-size:11.5px;margin-top:4px;word-break:break-all}
.lv{display:flex;align-items:center;gap:18px;padding:20px 22px;margin-bottom:14px;border-radius:26px;border:1.5px solid rgba(63,191,63,.5);background:linear-gradient(120deg,rgba(40,140,60,.55),rgba(8,32,16,.85));box-shadow:0 0 22px rgba(63,191,63,.15)}
.lv svg{flex:none;width:86px}
.lv .in{flex:1;min-width:0}.lv .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lv .l{font-size:34px;font-weight:800;font-style:italic;color:#9dff9d;line-height:1.1}
.lv a{font-size:12.5px;font-weight:600;font-style:italic;color:#ffd27a;white-space:nowrap}
.lv .t{font-size:13px;margin:6px 0}
.lv .tr{height:9px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}.lv .tr i{display:block;height:100%;background:linear-gradient(90deg,#1f8f2f,#7bff6a);border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.mini{border-radius:22px;padding:18px;min-height:112px;background:linear-gradient(135deg,rgba(30,110,50,.45),rgba(8,28,14,.8));border:1px solid var(--line)}
.mini .h{display:flex;justify-content:space-between;gap:6px;font-style:italic;font-weight:800;font-size:18px}.mini .h span{font-weight:500;font-size:11.5px;color:var(--mut);font-style:normal}
.mini .v{margin-top:14px;font-size:30px;font-weight:800;display:flex;align-items:center;gap:8px;color:#fff}
.mini .v.s{font-size:16px;color:#9dff9d;font-weight:600}
.coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f0b429);color:#7a4b00;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.row{display:flex;align-items:center;gap:16px;padding:12px 4px;cursor:pointer;background:none;border:0;color:#fff;width:100%;text-align:left;font-family:inherit}
.row .ic{width:56px;height:56px;flex:none;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px}
.row b{display:block;font-size:17px;font-weight:500}.row small{color:var(--mut);font-size:13px}
.row .ch{margin-left:auto;color:var(--mut);font-size:22px;transition:transform .2s}.row.open .ch{transform:rotate(90deg)}
.sec{margin:2px 0 12px}.sec .card{margin:0}
.atabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:6px}.atabs button{white-space:nowrap;flex:none}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;background:rgba(63,191,63,.2);color:#9dff9d}.tag.bad{background:rgba(255,120,100,.2);color:#ffb4a8}
.tag.warn{background:rgba(255,200,80,.2);color:#ffd27a}
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}.ov[hidden]{display:none}
.ov .box{max-width:480px;width:100%;max-height:88vh;overflow:auto;background:rgba(6,22,10,.98);margin:0}
.demo{background:rgba(255,200,80,.15);border:1px solid #ffd27a;color:#ffd27a;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:10px;line-height:1.5}
.sm{padding:5px 12px!important;font-size:11.5px!important}
.card table input{margin:0;padding:6px 8px;min-width:70px}
.card .scroll{margin-top:6px}
</style></head><body>

 <a href="#home" class="logo"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 21C3 10 10 3 21 3c0 11-7 18-18 18Z" fill="#3fbf3f"/><path d="M4 20 15 9" stroke="#052b0a" stroke-width="1.5"/></svg><span>ECO<b>SHOP</b><small>RECYCLE <b>SMART</b>, EARN <b>SMART</b></small></span></a>
 <button id="burger" aria-label="Menu">☰</button>
 <nav id="nav"></nav>
</header>
<main id="app"></main>
<button id="cb" aria-label="Chat with EcoBot">💬</button>

about(){return`<div class="page"><div class="wrap"><h1>About <em>EcoShop</em></h1><p class="sub">RECYCLE SMART, EARN SMART — a digital recycling-rewards business built by The Society.</p>
<div class="card"><h3>The problem</h3>Plastic, paper, glass and metal waste are increasing because many people do not recycle or dispose of their waste adequately. Recyclable materials are thrown away, causing pollution, harming the environment and creating an unpleasant smell within the community. Tshwane University of Technology (TUT) Soshanguve South Campus has become a trash enclosure within our community.</div>
<div class="card"><h3>Our solution</h3>EcoShop lets users earn reward points for recyclable materials. The points can then be exchanged for selected rewards. Beyond waste management, the project also has agricultural applications and potential for broader impact on our community and South Africa as a whole.</div>
<div class="card"><h3>Who we are</h3>The Society — Matlapeng A, Lebese K, Khulu SJ, Mabunda NN, Muhlari N, Nukeri S, Mavunga BC, Mokoena BM, Sehume O and Mthembu SN. Report compiled for Mrs. MT Popela, Lecturer for Communication for Academic Purposes (completed 17 September 2026).</div></div></div>`},

How to use: create a profile (name, surname, age, email verified by a code, and a password with 8+ characters, a number, a special symbol and an uppercase letter) on the Login/Sign up page, then log in, log recycling (material and weight) on your profile page, watch the points total, and redeem rewards there.
Survey of 15 people: food waste 93.3% and plastic bottles 73.3% most common waste; barriers: no nearby bins/drop-off 53.3% and no motivation/reward 53.3%; 73.3% would recycle more for points, 0% said no; preferred rewards: cash 86.7%, grocery vouchers 53.3%, airtime/data 46.7%; 16.65% very likely (4-5/5) to use a station within 1km, average 3/5; reasons to quit: rewards too low 46.7%, long queues/bad service 20%.
Similar businesses: Trash Cash (Philippines, AI plastic segregation), Kudoti (South Africa, 2019, cloud waste platform), Banlastic (Egypt, 2018, anti single-use plastic), WasteTrade (digital materials marketplace).
Plans: permanent database, hashed passwords, better material identification, detailed recycling records, more testing of the points system, wider user testing. Current demo keeps data in the user's own browser.`;

 const intro=`You are EcoBot, the friendly assistant on the EcoShop website. Answer only about EcoShop, recycling and the facts below. Be concise (under 70 words), plain text, no markdown. If the answer is not in the facts, say you don't know.\nFACTS:\n${KBf()}\n${u?`The visitor is logged in as ${u.name} with ${bal} points.`:'The visitor is not logged in.'}\n\nConversation follows.\n`;
 const msgs=hist.map((m,i)=>i==0?{role:'user',content:intro+m.content}:m);
 try{const sample=window.claude&&await claude.use('sample');if(!sample)throw {code:'none'};
  const r=await sample(msgs,{cache:false,modelTier:'quick',onText:({text})=>{out.textContent=text;$('cm').scrollTop=1e9}});out.textContent=r.text;hist.push({role:'assistant',content:r.text})}
 catch(e){const t=local(q);out.textContent=t;hist.push({role:'assistant',content:t})}}
$('cb').onclick=()=>{$('cw').classList.toggle('open');if(!$('cm').children.length){bub('Hi! I’m EcoBot 🌿 Ask me anything about EcoShop, points or rewards.','bot');QS.forEach(q=>{const b=document.createElement('button');b.textContent=q;b.onclick=()=>ask(q);$('cq').appendChild(b)})}};
$('cx').onclick=()=>$('cw').classList.remove('open');
$('cs').onclick=()=>ask($('ci').value);$('ci').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();ask($('ci').value)}};

 const d=n=>new Date(Date.now()-n*864e5).toLocaleDateString(),rc=(n,m,kg)=>({date:d(n),m,kg,pts:Math.round(kg*RATE[m])}),salt='demosalt',nx=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
 save({email:DEMO.email,name:'Demo',surname:'User',age:25,verified:true,id:'d3m0a1b2c3d4e5f6',photo:'',salt,hash:await hash(DEMO.pw,salt),
  records:[rc(9,'Plastic',3.2),rc(6,'Paper',5),rc(4,'Glass',2),rc(2,'Metal',1.2)],
  vol:[{id:'demo1',role:'Sorting',date:nx,note:'Demo application',applied:d(1),status:'Pending'}]});
 st.set('eco_demo_seeded','1')}catch(e){}}
addEventListener('hashchange',route);seedDemo().then(route,route);
